name: Build Redmi AC2100 ImmortalWrt Performance

on:
  workflow_dispatch:
    inputs:
      country:
        description: "WiFi regulatory country code (ISO 3166-1 alpha-2)"
        required: true
        type: string
        default: "CN"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Validate overlay
        run: python3 immortalwrt/scripts/check-immortalwrt-config.py immortalwrt

  build:
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils \
            bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool \
            jq lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
            libz-dev lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-pip python3-ply python3-pyelftools \
            python3-setuptools rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev
          sudo apt-get clean
          sudo timedatectl set-ntp true

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 --branch v25.12.1 \
            https://github.com/immortalwrt/immortalwrt.git \
            "$GITHUB_WORKSPACE/immortalwrt-src"
          cd immortalwrt-src
          echo "IW_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "IW_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Verify upstream
        run: python3 immortalwrt/scripts/inspect-upstream.py immortalwrt-src

      - name: Copy overlay files
        run: |
          cp -a immortalwrt/files/* immortalwrt-src/
          mkdir -p immortalwrt-src/target/linux/ramips/patches-6.12
          cp immortalwrt/patches/0001-mt7621-early-pll-overclock.patch \
             immortalwrt-src/target/linux/ramips/patches-6.12/

      - name: Replace country placeholder
        run: |
          cd immortalwrt-src
          sed -i "s/__COUNTRY__/${{ inputs.country }}/g" \
            etc/uci-defaults/99-rm2100-performance

      - name: Update LuCI feed only
        run: |
          cd immortalwrt-src
          ./scripts/feeds update luci
          ./scripts/feeds install -a -p luci

      - name: Select RM2100 profile
        run: |
          cd immortalwrt-src
          cp "$GITHUB_WORKSPACE/immortalwrt/configs/rm2100-minimal.seed" .config
          make defconfig
          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_redmi-router-ac2100=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-tcp-bbr=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-nft-fullcone=y$' .config

      - name: Validate and prepare kernel patch
        run: |
          cd immortalwrt-src
          make target/linux/prepare V=s

      - name: Pre-download musl from Buildroot mirror
        run: |
          cd immortalwrt-src
          curl --fail --retry 5 --retry-all-errors --connect-timeout 20 \
            -L https://sources.buildroot.net/musl/musl-1.2.5.tar.gz \
            -o dl/musl-1.2.5.tar.gz
          echo 'a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4  dl/musl-1.2.5.tar.gz' | sha256sum -c -

      - name: Download sources
        run: |
          cd immortalwrt-src
          make download -j8 V=s
          test -x staging_dir/host/bin/ninja
          find staging_dir/toolchain-* -type f -name '*-gcc' -executable -print -quit | grep .

      - name: Build firmware
        run: cd immortalwrt-src && make -j$(nproc) V=s


      - name: Collect images
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          find immortalwrt-src/bin/targets/ -name "*xiaomi*ac2100*" \
            -exec cp -v {} "$GITHUB_WORKSPACE/output/" \;
          ls -lh "$GITHUB_WORKSPACE/output/" || {
            echo "No RM2100 images found in build output"
            find immortalwrt-src/bin/targets/ -type f -name "*.bin" -o -name "*.itb" | head -20
            exit 1
          }
          echo "IW_COMMIT=$IW_COMMIT" >> "$GITHUB_ENV"
          echo "IW_SHORT=$IW_SHORT" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RM2100-immortalwrt-${{ env.IW_SHORT }}-${{ env.BUILD_DATE }}
          path: ${{ github.workspace }}/output/*
          if-no-files-found: error

      - name: Create experimental release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ env.BUILD_DATE }}-${{ env.IW_SHORT }}
          name: "RM2100 ImmortalWrt ${{ env.IW_SHORT }} (${{ env.BUILD_DATE }})"
          prerelease: true
          body: |
            **EXPERIMENTAL** — OC1000 + SFO + FullCone + BBR

            - Device: Redmi AC2100 (RM2100)
            - ImmortalWrt commit: `${{ env.IW_COMMIT }}`
            - Kernel: 6.12
            - WiFi country: `${{ inputs.country }}`
            - CPU: ~1000 MHz via early PLL FBDIV override
            - Acceleration: SFO on, FullCone IPv4 on, IPv6 FullCone off
            - BBR: kernel module, router-originated TCP only
            - No HNAT/SFE — do not claim hardware acceleration
            - FullCone: UDP full-cone NAT; other protocols = MASQUERADE
            - OC1000 is experimental — flash via Breed, keep recovery image
            - WAN must be tested: DHCP, modem reboot, link flap, 24h soak
          files: ${{ github.workspace }}/output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
